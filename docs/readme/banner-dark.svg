<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="NODO: Your devices. Your interface. A local-first iPad dashboard for DIY electronics and, later, the whole home."><title>NODO: Your devices. Your interface. A local-first iPad dashboard for DIY electronics and, later, the whole home.</title><style>
