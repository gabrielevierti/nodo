<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-label="Features: Dashboard Studio: Named dashboards with columns, widths, themes and accent colours; drag widgets to reorder.; Widget engine: Switches, sliders, buttons, joystick, gauge and chart, each bindable to a device.; ESP32 over Bluetooth LE: Scan, connect and control a reference ESP32 switch from a physical iPad.; Demo mode: Runs in the iPad simulator with no server, no ESP32 and no cloud account.; Optional NODO Core: A Python hub with MQTT, automations and a browser dashboard, for always-on control.; Honest state: Commands show as done only when the device reports back, never optimistically."><title>Features: Dashboard Studio: Named dashboards with columns, widths, themes and accent colours; drag widgets to reorder.; Widget engine: Switches, sliders, buttons, joystick, gauge and chart, each bindable to a device.; ESP32 over Bluetooth LE: Scan, connect and control a reference ESP32 switch from a physical iPad.; Demo mode: Runs in the iPad simulator with no server, no ESP32 and no cloud account.; Optional NODO Core: A Python hub with MQTT, automations and a browser dashboard, for always-on control.; Honest state: Commands show as done only when the device reports back, never optimistically.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#58a6ff;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
