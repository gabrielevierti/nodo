name: NODO
options:
  bundleIdPrefix: dev.nodo
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: '2'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 'NODO uses Bluetooth to find and control your DIY devices.'
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'NODO uses your local network to control compatible devices.'
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown'
targets:
  NODO:
    type: application
    platform: iOS
    sources: [NODO]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nodo.app
        GENERATE_INFOPLIST_FILE: YES
