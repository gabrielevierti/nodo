services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
  nodo:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      NODO_MQTT_HOST: mqtt
      NODO_DB: /data/nodo.sqlite3
    volumes:
      - nodo_data:/data
    depends_on:
      - mqtt
volumes:
  nodo_data:
  mqtt_data:
